<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Поймай смысл</title>
<meta name="description" content="Игровой тренажёр: поймать смысл фразы с первого раза">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Смысл">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EAF2EE">
<style>
  :root {
    --bg: #EAF2EE;
    --surface: #FFFFFF;
    --surface-2: #F4F8F6;
    --ink: #1C2A27;
    --muted: #5A6E69;
    --line: #CFDDD8;
    --accent: #F2622E;
    --accent-ink: #FFFFFF;
    --audio: #2C66E0;
    --ok: #16935A;
    --ok-bg: #DDF5E8;
    --bad: #D63A33;
    --bad-bg: #FDE3E1;
    --star: #F2A900;
    --mark: #FFD84D;
    --shadow: 0 2px 0 rgba(28, 42, 39, .08), 0 8px 24px rgba(28, 42, 39, .06);
    --r: 22px;
    --sky-top: #8CCBFF; --sky-bottom: #EAF6FF; --cloud: rgba(255, 255, 255, .9); --frame: #FFFFFF; --night: 0;
    --font: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0F1715; --surface: #18231F; --surface-2: #1F2C28; --ink: #E4EEEA; --muted: #9DB2AC; --line: #2B3B36;
      --accent: #FF7447; --accent-ink: #1A0C06; --audio: #7FA6FF; --ok: #44CC8A; --ok-bg: #173A2A; --bad: #FF6F66; --bad-bg: #3F1D1B;
      --star: #FFC433; --mark: #8C7200; --shadow: 0 2px 0 rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
      --sky-top: #081330; --sky-bottom: #1B2B52; --cloud: rgba(255, 255, 255, .07); --frame: #E4EEEA; --night: 1;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0F1715; --surface: #18231F; --surface-2: #1F2C28; --ink: #E4EEEA; --muted: #9DB2AC; --line: #2B3B36;
    --accent: #FF7447; --accent-ink: #1A0C06; --audio: #7FA6FF; --ok: #44CC8A; --ok-bg: #173A2A; --bad: #FF6F66; --bad-bg: #3F1D1B;
    --star: #FFC433; --mark: #8C7200; --shadow: 0 2px 0 rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
      --sky-top: #081330; --sky-bottom: #1B2B52; --cloud: rgba(255, 255, 255, .07); --frame: #E4EEEA; --night: 1;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink); font: 500 18px/1.4 var(--font);
    -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none;
    touch-action: manipulation; overscroll-behavior: none;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--audio); outline-offset: 3px; }
  [hidden] { display: none !important; }

  #app {
    min-height: 100%; max-width: 1100px; margin: 0 auto;
    padding-inline: max(16px, env(safe-area-inset-left)) max(16px, env(safe-area-inset-right));
    padding-block: calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-bottom) + 20px);
    display: flex; flex-direction: column; gap: 20px;
  }

  /* Верхняя полоса тренировки */
  .bar { display: flex; align-items: center; gap: 14px; min-height: 44px; }
  .progress { flex: 1; height: 12px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .progress i { display: block; height: 100%; width: 0; background: var(--ok); border-radius: inherit; transition: width .25s linear; }
  .stars { font-weight: 800; font-size: 22px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .stars b { color: var(--star); }
  .testbadge { background: var(--audio); color: #fff; font-weight: 800; font-size: 13px; letter-spacing: .08em; border-radius: 8px; padding: 4px 8px; }
  .btn.danger { color: var(--bad); }
  .exit { border: 0; background: none; color: var(--muted); font-size: 16px; padding: 8px 4px; }

  /* Кнопки */
  .btn {
    border: 0; border-radius: 999px; padding: 18px 34px; min-height: 64px; font-weight: 800; font-size: 22px;
    background: var(--surface); color: var(--ink); box-shadow: var(--shadow);
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .btn.audio { background: var(--audio); color: #fff; }
  .btn.small { min-height: 48px; padding: 10px 20px; font-size: 18px; }
  .btn:disabled { opacity: .45; }
  .btn:active:not(:disabled) { transform: translateY(1px); }

  /* Главный экран */
  .home { flex: 1; display: grid; place-content: center; justify-items: center; text-align: center; gap: 26px; }
  .logo { font-size: clamp(44px, 8vw, 76px); font-weight: 900; letter-spacing: -.02em; line-height: 1; text-wrap: balance; }
  .logo span { background: linear-gradient(transparent 62%, var(--mark) 62%, var(--mark) 88%, transparent 88%); padding: 0 .08em; }
  .hello { color: var(--muted); font-size: 22px; margin: 0; }
  .chips { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .chip { background: var(--surface); border-radius: 999px; padding: 10px 18px; font-weight: 700; box-shadow: var(--shadow); font-variant-numeric: tabular-nums; }
  .home .hello { color: var(--ink); font-weight: 700; }

  /* Небо главного экрана: облака плывут, фото «парит» как в аэротрубе, снизу дует ветер */
  .sky {
    position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none;
    background: linear-gradient(180deg, var(--sky-top), var(--sky-bottom) 75%);
  }
  .sky::before { /* звёзды — видны только в тёмной теме */
    content: ""; position: absolute; inset: 0; opacity: var(--night);
    background-image:
      radial-gradient(2px 2px at 8% 14%, #fff 50%, transparent 51%), radial-gradient(2px 2px at 23% 32%, #fff 50%, transparent 51%),
      radial-gradient(3px 3px at 41% 9%, #fff 50%, transparent 51%), radial-gradient(2px 2px at 64% 22%, #fff 50%, transparent 51%),
      radial-gradient(2px 2px at 79% 7%, #fff 50%, transparent 51%), radial-gradient(3px 3px at 91% 29%, #fff 50%, transparent 51%),
      radial-gradient(2px 2px at 13% 58%, #fff 50%, transparent 51%), radial-gradient(2px 2px at 86% 61%, #fff 50%, transparent 51%),
      radial-gradient(2px 2px at 55% 44%, #fff 50%, transparent 51%), radial-gradient(3px 3px at 33% 76%, #fff 50%, transparent 51%);
    animation: twinkle 4s ease-in-out infinite alternate;
  }
  @keyframes twinkle { to { filter: brightness(.55); } }
  .cloud {
    position: absolute; left: 0; width: 170px; height: 52px; border-radius: 99px; background: var(--cloud);
    animation: drift var(--t, 60s) linear infinite; animation-delay: var(--d, 0s);
  }
  .cloud::before, .cloud::after { content: ""; position: absolute; background: inherit; border-radius: 50%; }
  .cloud::before { width: 74px; height: 74px; left: 26px; top: -38px; }
  .cloud::after { width: 96px; height: 96px; right: 20px; top: -52px; }
  @keyframes drift {
    from { transform: translateX(-240px) scale(var(--s, 1)); }
    to { transform: translateX(calc(100vw + 60px)) scale(var(--s, 1)); }
  }

  .flyer {
    border: 0; padding: 0; background: none; position: relative;
    width: min(62vw, 480px, 42vh); aspect-ratio: 4 / 3; margin-block: 8px 18px;
    animation: hover 3.2s ease-in-out infinite;
  }
  @keyframes hover { 50% { transform: translateY(-14px); } }
  .flyer .frame {
    position: absolute; inset: 0; border-radius: 28px; overflow: hidden; border: 6px solid var(--frame);
    background: var(--sky-bottom); box-shadow: 0 18px 40px rgba(20, 60, 120, .28); transform: rotate(-3deg);
    display: grid; place-items: center; font-size: clamp(64px, 10vw, 110px);
  }
  .flyer img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .flyer.spin .frame { animation: loop .9s ease-in-out; }
  @keyframes loop { 50% { transform: rotate(177deg) scale(.8); } to { transform: rotate(357deg) scale(1); } }
  .gust { /* струи ветра из-под «трубы» */
    position: absolute; bottom: -26px; width: 4px; height: 34px; border-radius: 99px;
    background: linear-gradient(transparent, var(--frame));
    opacity: 0; animation: gust 1.4s ease-in infinite; animation-delay: var(--d, 0s);
  }
  @keyframes gust { 0% { transform: translateY(24px); opacity: 0; } 30% { opacity: .9; } 100% { transform: translateY(-30px); opacity: 0; } }
  .burst {
    position: absolute; left: 50%; top: 50%; font-size: 34px; pointer-events: none;
    animation: burst .9s ease-out forwards;
  }
  @keyframes burst {
    from { transform: translate(-50%, -50%) scale(.3); opacity: 1; }
    to { transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(1.1); opacity: 0; }
  }

  /* Копилка */
  .bank { background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); padding: 10px 18px; width: min(520px, 90vw); display: grid; gap: 6px; }
  .bank-top { display: flex; align-items: baseline; gap: 8px; justify-content: center; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
  .bank-top b { font-size: 24px; }
  .bank-top .muted { font-size: 16px; }
  .pig { font-size: 26px; }
  .bank-bar { height: 10px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .bank-bar i { display: block; height: 100%; background: var(--star); border-radius: inherit; }
  .bank-note { color: var(--muted); font-size: 15px; }
  .bank-add { font-size: 30px; font-weight: 900; color: var(--ok); }
  .build { margin: 0; text-align: center; color: var(--muted); font-size: 13px; opacity: .7; font-variant-numeric: tabular-nums; }
  .note { color: var(--muted); max-width: 32ch; margin: 0; text-wrap: balance; }

  /* Вступление к игре */
  .intro { flex: 1; display: grid; place-content: center; justify-items: center; text-align: center; gap: 22px; }
  .intro .big { font-size: 88px; line-height: 1; }
  .intro h2 { margin: 0; font-size: clamp(36px, 6vw, 54px); font-weight: 900; }
  .intro p { margin: 0; max-width: 30ch; font-size: 22px; color: var(--muted); text-wrap: balance; }
  .mode { display: inline-flex; align-items: center; gap: 8px; font-weight: 800; border-radius: 999px; padding: 8px 16px; }
  .mode.read { background: var(--ok-bg); color: var(--ok); }
  .mode.audio { background: color-mix(in srgb, var(--audio) 16%, transparent); color: var(--audio); }

  /* Задание */
  .task { flex: 1; display: flex; flex-direction: column; gap: 22px; }
  .prompt {
    background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow);
    min-height: 150px; padding: 26px 28px; display: grid; place-content: center; text-align: center; gap: 14px;
  }
  .sentence { font-size: clamp(26px, 4.4vw, 42px); font-weight: 800; line-height: 1.3; margin: 0; text-wrap: balance; }
  .ask { font-size: clamp(22px, 3.4vw, 30px); font-weight: 800; margin: 0; color: var(--muted); }
  .hint { margin: 0; color: var(--muted); font-size: 18px; }
  mark {
    background: linear-gradient(transparent 58%, var(--mark) 58%); color: inherit; padding: 0 .06em;
    text-decoration: underline wavy var(--accent); text-decoration-thickness: 3px; text-underline-offset: 8px;
  }
  .timer { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; width: min(420px, 70vw); margin: 0 auto; }
  .timer i { display: block; height: 100%; background: var(--accent); width: 100%; transform-origin: left; }
  .listen { font-size: 64px; line-height: 1; }
  .listen.on { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.12); } }

  .options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  @media (max-width: 640px) { .options { grid-template-columns: 1fr; } }
  .opt {
    border: 4px solid transparent; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow);
    min-height: 130px; padding: 18px 12px; display: flex; flex-wrap: wrap; align-content: center; justify-content: center; gap: 4px 6px;
    font-size: clamp(36px, 5.2vw, 60px); line-height: 1.15;
  }
  .pic { width: 1.15em; height: 1.15em; object-fit: contain; display: block; pointer-events: none; -webkit-user-drag: none; }
  .opt.ok { border-color: var(--ok); background: var(--ok-bg); }
  .opt.bad { border-color: var(--bad); background: var(--bad-bg); animation: shake .35s; }
  .opt:disabled { opacity: 1; }
  @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }

  .field { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .cell {
    aspect-ratio: 1; max-width: 100%; border: 4px solid transparent; background: var(--surface); border-radius: 20px; box-shadow: var(--shadow);
    font-size: clamp(44px, 9vw, 96px); line-height: 1; display: grid; place-items: center; position: relative;
  }
  /* Альбомный iPad: поле в два ряда, чтобы помещалось без прокрутки даже с панелью Safari */
  @media (orientation: landscape) and (min-width: 800px) {
    .field { grid-template-columns: repeat(var(--cols, 4), 1fr); }
    .cell { aspect-ratio: auto; height: min(20vh, 180px); font-size: clamp(44px, 11vh, 90px); }
    .task { gap: 16px; }
    .task .prompt { min-height: 110px; padding-block: 18px; }
  }
  .cell.sel { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
  .cell.need { border: 4px dashed var(--ok); }
  .cell.sel.need, .cell.hit { border: 4px solid var(--ok); background: var(--ok-bg); }
  .cell.bad { border-color: var(--bad); background: var(--bad-bg); }
  .cell.bad::after { content: "✕"; position: absolute; top: 4px; right: 10px; font-size: 22px; color: var(--bad); font-weight: 900; }

  /* «Ловушка»: каждое слово фразы — кнопка; найденное подчёркивается как ручкой */
  .trapline .w {
    border: 0; background: none; font: inherit; color: inherit; padding: 2px 4px; margin: 0 -2px; border-radius: 10px;
    text-decoration-thickness: 3px; text-underline-offset: 8px;
  }
  .trapline .w:active { background: var(--surface-2); }
  .trapline .w.hit { background: linear-gradient(transparent 58%, var(--mark) 58%); text-decoration: underline wavy var(--accent); }
  .trapline .w.hit, .trapline .w.need { animation: pop .5s ease-out; }
  .trapline .w.bad { color: var(--bad); text-decoration: line-through; animation: shake .35s; }
  .trapline .w.need { background: var(--ok-bg); outline: 3px dashed var(--ok); outline-offset: 2px; }
  .why1 { margin: 0 auto; font-size: clamp(18px, 2.6vw, 24px); font-weight: 700; background: var(--surface-2); border-radius: 14px; padding: 6px 16px; text-wrap: balance; }
  .why { display: grid; gap: 6px; justify-items: center; text-align: center; }
  .why p { margin: 0; font-size: clamp(20px, 2.8vw, 26px); font-weight: 700; background: var(--surface); border-radius: 14px; padding: 8px 16px; box-shadow: var(--shadow); }

  .actions { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  .feedback:empty { display: none; }
  .feedback { text-align: center; font-size: 26px; font-weight: 800; min-height: 36px; margin: 0; }
  .feedback.ok { color: var(--ok); }
  .feedback.bad { color: var(--bad); }
  .pop { display: inline-block; animation: pop .5s ease-out; }
  @keyframes pop { 0% { transform: scale(.4); } 70% { transform: scale(1.25); } 100% { transform: scale(1); } }

  /* Итог */
  .done { flex: 1; display: grid; place-content: center; justify-items: center; text-align: center; gap: 20px; }
  .done h2 { margin: 0; font-size: clamp(34px, 6vw, 52px); font-weight: 900; }
  .bigstars { font-size: 60px; font-weight: 900; color: var(--star); font-variant-numeric: tabular-nums; }
  .sync { color: var(--muted); font-size: 16px; margin: 0; }

  /* Экран родителя */
  .parent { display: flex; flex-direction: column; gap: 18px; -webkit-user-select: text; user-select: text; }
  .parent h2 { margin: 0; font-size: 30px; font-weight: 900; }
  .card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 20px 22px; display: flex; flex-direction: column; gap: 14px; }
  .card h3 { margin: 0; font-size: 20px; font-weight: 800; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
  .kv div { background: var(--surface-2); border-radius: 14px; padding: 12px 14px; }
  .kv b { display: block; font-size: 26px; font-variant-numeric: tabular-nums; }
  .kv span { color: var(--muted); font-size: 15px; }
  label { display: flex; flex-direction: column; gap: 6px; font-weight: 700; font-size: 16px; flex: 1 1 240px; }
  input, select {
    font: inherit; font-weight: 500; padding: 12px 14px; border-radius: 12px; border: 2px solid var(--line);
    background: var(--surface-2); color: var(--ink); min-height: 48px; width: 100%;
  }
  .muted { color: var(--muted); font-size: 15px; margin: 0; }
  .status.ok { color: var(--ok); }
  .status.bad { color: var(--bad); }
  .tbl-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 700; font-size: 14px; }

  /* Вход для родителя: долгое нажатие */
  .gear {
    position: fixed; right: max(10px, env(safe-area-inset-right)); bottom: calc(env(safe-area-inset-bottom) + 10px);
    width: 44px; height: 44px; border-radius: 50%; border: 0; background: none; color: var(--muted); opacity: .45; font-size: 22px;
  }
  .gear.hold { opacity: 1; background: conic-gradient(var(--accent) var(--p, 0%), transparent 0); }
  .gate {
    position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 16px;
    background: rgba(28, 42, 39, .45); -webkit-user-select: text; user-select: text;
  }
  .gate .card { width: min(420px, 100%); }
  .gate label { display: flex; flex-direction: column; gap: 8px; font-weight: 700; }
  td.wrap { white-space: normal; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<button class="gear" id="gear" aria-label="Для взрослых: удерживайте 2 секунды">⚙︎</button>
<script src="content.js"></script>
<script src="store.js"></script>
<script src="app.js"></script>
</body>
</html>
